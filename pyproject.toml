[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-document-qa"
version = "0.1.0"
description = "A small, dependency-light retrieval-augmented generation Q&A engine with citations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "awf-cpu" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
openai = ["openai>=1.0"]
pdf = ["pypdf>=4.0"]
dev = ["pytest>=7.4"]

[tool.setuptools]
packages = ["rag_qa"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
